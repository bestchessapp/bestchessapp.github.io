<!DOCTYPE html>
<html lang="en">
<head>
  <!-- No <base> tag on purpose: every path is relative, as CrazyGames
       requires (the game runs from whatever folder it is uploaded to). -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="BEST CHESS: boost your chess rating with puzzles, games against the computer and games with a friend.">
  <title>BEST CHESS Game Review</title>
  <meta name="robots" content="noindex">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1f1b18;
      overflow: hidden;
      /* No text selection or magnifier on touch screens (CrazyGames). */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #bc-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #1f1b18; color: #d4a85a; z-index: 10;
      font-family: Georgia, 'Times New Roman', serif; transition: opacity .3s;
    }
    #bc-loader .t { font-size: 44px; font-weight: 900; letter-spacing: 1px; }
    #bc-loader .s { font: 600 15px system-ui, sans-serif; color: #b9ab98; letter-spacing: 1.5px; }
    #bc-loader .bar { width: 220px; height: 6px; border-radius: 3px; background: #3a332c; overflow: hidden; }
    #bc-loader .bar i { display: block; width: 40%; height: 100%; background: #d4a85a;
      border-radius: 3px; animation: bcslide 1.1s ease-in-out infinite; }
    @keyframes bcslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
  <script src="bc_bridge.js"></script>
</head>
<body>
  <div id="bc-loader"><div style="font-size:42px">&#9813;</div><div class="t">BEST CHESS</div>
    <div class="s">FREE GAME REVIEW</div><div class="bar"><i></i></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
